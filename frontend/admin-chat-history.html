<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Chat History</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    margin:0;
    background:#eef3fb;
}

header{
    background:#2563eb;
    color:white;
    padding:18px 30px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h2{
    margin:0;
}

header button{
    background:white;
    color:#2563eb;
    border:none;
    padding:9px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px;
}

.container > h2{
    margin-bottom:25px;
}

.chat-card{
    background:white;
    padding:20px;
    margin-bottom:18px;
    border-radius:12px;

    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.chat-card h3{
    color:#2563eb;
    margin-top:0;
}

.question{
    background:#f1f5f9;
    padding:12px;
    border-radius:8px;
    margin-bottom:12px;
}

.answer{
    background:#eff6ff;
    padding:12px;
    border-radius:8px;
}

.question p,
.answer p{
    margin-bottom:0;
    white-space:pre-wrap;
    line-height:1.6;
}

.error{
    color:red;
    text-align:center;
}

.empty{
    background:white;
    padding:25px;
    border-radius:12px;
    text-align:center;
}

</style>

</head>


<body>


<header>

    <h2>My Chat History</h2>

    <button onclick="window.location.href='admin-dashboard.html'">
        Dashboard
    </button>

</header>


<div class="container">

    <h2>My Private AI Conversations</h2>

    <div id="chatHistory">
        Loading chat history...
    </div>

</div>


<script>

/* -----------------------------------------
   GET LOGIN INFORMATION
----------------------------------------- */

const token = localStorage.getItem("access_token");
const role = localStorage.getItem("role");


/* -----------------------------------------
   CHECK ADMIN LOGIN
----------------------------------------- */

if(!token || role !== "admin"){

    window.location.href = "index.html";

}


/* -----------------------------------------
   LOAD PRIVATE CHAT HISTORY
----------------------------------------- */

async function loadChatHistory(){

    try{

        const response = await fetch(
            "/chat-history",
            {
                method:"GET",

                headers:{
                    "Authorization":"Bearer " + token
                }
            }
        );


        /* -----------------------------------------
           CHECK RESPONSE
        ----------------------------------------- */

        if(!response.ok){

            console.error(
                "Chat history request failed:",
                response.status
            );

            document.getElementById("chatHistory").innerHTML =
                '<p class="error">Could not load chat history.</p>';

            return;

        }


        /* -----------------------------------------
           GET DATA
        ----------------------------------------- */

        const history = await response.json();

        const container =
            document.getElementById("chatHistory");


        container.innerHTML = "";


        /* -----------------------------------------
           NO HISTORY
        ----------------------------------------- */

        if(history.length === 0){

            container.innerHTML =
                '<div class="empty">No chat history found.</div>';

            return;

        }


        /* -----------------------------------------
           DISPLAY HISTORY
        ----------------------------------------- */

        history.forEach(chat => {

            const card = document.createElement("div");

            card.className = "chat-card";


            card.innerHTML = `

                <h3>
                    Conversation #${chat.id}
                </h3>

                <div class="question">

                    <b>Question:</b>

                    <p>${chat.question}</p>

                </div>

                <div class="answer">

                    <b>AI Answer:</b>

                    <p>${chat.answer}</p>

                </div>

            `;


            container.appendChild(card);

        });

    }

    catch(error){

        console.error(
            "Chat history error:",
            error
        );

        document.getElementById("chatHistory").innerHTML =
            '<p class="error">Could not connect to the server.</p>';

    }

}


/* -----------------------------------------
   START
----------------------------------------- */

loadChatHistory();

</script>


</body>

</html>
