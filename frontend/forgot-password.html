<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    margin:0;
    background:#eef3fb;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}

.container{
    background:white;
    width:380px;
    padding:35px;

    border-radius:12px;

    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    color:#2563eb;
    margin-bottom:10px;
}

.info{
    text-align:center;
    color:#666;
    font-size:14px;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;

    margin-bottom:15px;

    border:1px solid #d1d5db;
    border-radius:6px;

    font-size:15px;
}

button{
    width:100%;
    padding:12px;

    background:#2563eb;
    color:white;

    border:none;
    border-radius:6px;

    font-size:16px;

    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.message{
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

.login-link{
    text-align:center;
    margin-top:20px;
    font-size:14px;
}

.login-link a{
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>


<body>


<div class="container">

    <h2>Forgot Password?</h2>

    <p class="info">
        Enter your username and choose a new password.
    </p>


    <input
        type="text"
        id="username"
        placeholder="Username"
    >


    <input
        type="password"
        id="newPassword"
        placeholder="New Password"
    >


    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm New Password"
    >


    <button onclick="resetPassword()">
        Reset Password
    </button>


    <div id="message" class="message"></div>


    <div class="login-link">

        Remember your password?

        <a href="index.html">
            Login
        </a>

    </div>

</div>


<script>

async function resetPassword(){

    const username =
        document.getElementById("username").value.trim();

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");


    if(!username || !newPassword || !confirmPassword){

        message.style.color = "red";

        message.innerText =
            "Please fill in all fields.";

        return;

    }


    if(newPassword !== confirmPassword){

        message.style.color = "red";

        message.innerText =
            "Passwords do not match.";

        return;

    }


    try{

        const response = await fetch(
            "http://127.0.0.1:8000/auth/reset-password",
            {
                method:"PUT",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    username:username,
                    new_password:newPassword

                })
            }
        );


        const data = await response.json();


        if(!response.ok){

            message.style.color = "red";

            message.innerText =
                data.detail || "Password reset failed.";

            return;

        }


        message.style.color = "green";

        message.innerText =
            "Password reset successfully!";


        setTimeout(() => {

            window.location.href = "index.html";

        }, 1500);


    }
    catch(error){

        console.error(error);

        message.style.color = "red";

        message.innerText =
            "Could not connect to the server.";

    }

}

</script>


</body>

</html>
